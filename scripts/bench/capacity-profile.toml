# Template for scripts/bench/capacity.sh: the bot counts and the duration are substituted per run.
# A mixed population (fighters, looters, wanderers) exercises movement, combat and drops together;
# every bot enters the lowest live zone (Zone A), so this measures one crowded map.
[backend]
base_url = "http://localhost:5100"

[world]
id = 1
class_id = 1

[bots]
wanderers = @WANDERERS@
fighters = @FIGHTERS@
looters = @LOOTERS@
travelers = 0
seed = 11
account_prefix = "cap"
password = "bots-capacity-2026"

[run]
duration_sec = @DURATION@
min_bots_seeing_others = 1
min_kills = 0
min_pickups = 0
min_zone_changes = 0

[client]
tick_hz = 20
ping_interval_ms = 1000
connect_timeout_ms = 10000

[wanderer]
arrive_distance_m = 1.0
retarget_after_ticks = 400
idle_ticks_min = 0
idle_ticks_max = 10
margin_m = 2.0

[fighter]
engage_radius_m = 40.0
attack_skill_id = 1
attack_range_m = 2.5
attack_interval_ms = 900

[looter]
loot_radius_m = 20.0
pickup_range_m = 1.5
pickup_retry_ms = 2000

[traveler]
dwell_ms = 10000
request_retry_ms = 2000
portal_approach_m = 1.0

[logging]
level = "info"
