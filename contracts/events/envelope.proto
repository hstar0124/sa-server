syntax = "proto3";

package sa.events.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Sa.Events.V1";

// Kafka로 발행되는 확정 이벤트의 공통 봉투.
// payload는 event_type에 대응하는 메시지의 직렬화 바이트.
message EventEnvelope {
  bytes event_id = 1;          // UUID 16바이트. Outbox 행과 동일
  string event_type = 2;       // 예: "InventoryItemAcquired"
  uint32 schema_version = 3;
  uint64 world_id = 4;
  string aggregate_type = 5;   // 예: "character"
  uint64 aggregate_id = 6;
  uint64 aggregate_seq = 7;    // aggregate별 단조 증가. 업무 트랜잭션에서 할당
  bytes request_id = 8;        // 원인 요청의 멱등성 키
  google.protobuf.Timestamp occurred_at = 9;
  bytes payload = 10;
}

// ---- character 집합 (토픽 game.character-events.v1, 키 world_id:character_id) ----

// 바닥 아이템이 캐릭터 인벤토리로 들어왔다 (PickupItem 커밋).
message InventoryItemAcquired {
  uint64 character_id = 1;
  bytes item_instance_id = 2;
  uint32 item_template_id = 3;
  uint32 inventory_version = 4;
}

// 캐릭터의 몬스터 처치가 기록됐다: 영수증, 드롭 표에서 정한 골드, 떨어진 아이템 (RecordKill 커밋).
message KillRecorded {
  uint64 character_id = 1;
  bytes kill_id = 2;            // 16바이트. kill_receipts의 기본 키
  uint32 monster_template_id = 3;
  uint64 gold_granted = 4;
  uint64 gold_balance = 5;      // 입금 뒤 잔액
  repeated DroppedItemRef drops = 6;
}

message DroppedItemRef {
  bytes item_instance_id = 1;
  uint32 item_template_id = 2;
}

// A trade settled; one event per participant on that character's stream (ADR-0013).
message TradeCompleted {
  bytes trade_id = 1;
  uint64 character_id = 2;
  uint64 counterparty_id = 3;
  uint64 gold_given = 4;
  uint64 gold_received = 5;
  repeated DroppedItemRef items_given = 6;
  repeated DroppedItemRef items_received = 7;
  uint32 inventory_version = 8;
}
