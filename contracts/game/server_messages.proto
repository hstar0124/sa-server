syntax = "proto3";

package sa.game.v1;

import "game/common.proto";

option csharp_namespace = "Sa.Game.V1";

// Gateway → 클라이언트.
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Pong pong = 2;
    Kick kick = 3;
    WorldSnapshot world_snapshot = 10;
    CommandResult command_result = 11;
    CombatEvent combat_event = 12;
    InventoryUpdate inventory_update = 13;
  }
}

// 접속 직후, 그리고 Zone이 바뀔 때마다 다시 온다. 클라이언트는 받을 때마다 월드 모델을 비운다.
message Welcome {
  uint64 character_id = 1;
  uint32 zone_id = 2;
  uint32 simulation_hz = 3;
  uint64 server_tick = 4;
  uint64 entity_id = 5;   // 수신자의 엔티티 id. 스냅샷에서 자기 자신을 식별한다
  Vec2 map_size = 6;
  repeated Portal portals = 7;
}

// 다른 Zone으로 가는 통로. 반경 안에서 ChangeZone(portal_id)을 보내면 이동이 시작된다.
message Portal {
  uint32 portal_id = 1;
  Vec2 position = 2;
  float radius_m = 3;
  uint32 to_zone_id = 4;
}

message Pong {
  uint32 nonce = 1;
  uint64 client_time_ms = 2;
  uint64 server_time_ms = 3;
}

enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  KICK_REASON_PROTOCOL_VERSION = 1;
  KICK_REASON_INVALID_TICKET = 2;
  KICK_REASON_DUPLICATE_SESSION = 3;
  KICK_REASON_RATE_LIMITED = 4;
  KICK_REASON_SERVER_SHUTDOWN = 5;
  KICK_REASON_PROTOCOL_ERROR = 6;
  KICK_REASON_SERVICE_UNAVAILABLE = 7;   // backend or zone unreachable; retry later
  KICK_REASON_ZONE_UNAVAILABLE = 8;      // zone full or not authoritative
  KICK_REASON_IDLE_TIMEOUT = 9;          // nothing arrived for too long; a live client pings every second
  KICK_REASON_SLOW_CLIENT = 10;          // the client read too little: its unsent output passed the gateway's limit
}

message Kick {
  KickReason reason = 1;
}

message EntitySpawn {
  uint64 entity_id = 1;
  EntityKind kind = 2;
  uint32 template_id = 3;
  Vec2 position = 4;
  uint32 hp = 5;
  uint32 max_hp = 6;
}

message EntityUpdate {
  uint64 entity_id = 1;
  Vec2 position = 2;
  Vec2 velocity = 3;
  uint32 hp = 4;
}

// 수신자 자신의 자원. 다른 플레이어의 MP는 보내지 않는다.
message SelfVitals {
  uint32 hp = 1;
  uint32 max_hp = 2;
  uint32 mp = 3;
  uint32 max_mp = 4;
}

// 관심 영역 델타. 서버가 생성하며 클라이언트는 self와 last_processed_input_seq로 자기 예측을 보정한다.
message WorldSnapshot {
  uint64 server_tick = 1;
  uint32 last_processed_input_seq = 2;
  repeated EntitySpawn spawned = 3;
  repeated EntityUpdate updated = 4;
  repeated uint64 despawned = 5;
  // 수신자 자신의 서버 권위 상태. 매 스냅샷에 포함된다.
  EntityUpdate self = 6;
  SelfVitals self_vitals = 7;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;   // 확정 커밋됨
  COMMAND_STATUS_REJECTED = 2;   // 검증 실패. 재시도 무의미
  COMMAND_STATUS_PENDING = 3;    // Backend 확정 대기 중
  COMMAND_STATUS_UNKNOWN = 4;    // 결과를 모름. 같은 request_id로 재조회
}

// 거절 사유 (README "전투"의 검증 순서). 같은 request_id를 재시도하면 같은 사유가 돌아온다.
enum RejectCode {
  REJECT_CODE_UNSPECIFIED = 0;
  REJECT_CODE_UNKNOWN_SKILL = 1;
  REJECT_CODE_NOT_LEARNED = 2;
  REJECT_CODE_DEAD = 3;
  REJECT_CODE_ALREADY_CASTING = 4;
  REJECT_CODE_NOT_ENOUGH_MP = 5;
  REJECT_CODE_ON_COOLDOWN = 6;
  REJECT_CODE_INVALID_TARGET = 7;
  REJECT_CODE_OUT_OF_RANGE = 8;
  REJECT_CODE_INVALID_REQUEST = 9;      // request_id가 없거나(0), 같은 request_id에 다른 요청을 실었다
  // 획득 (PickupItem)
  REJECT_CODE_ITEM_NOT_FOUND = 20;      // 바닥에 그런 아이템이 없다(다른 사람이 가져갔거나 사라졌다)
  REJECT_CODE_ITEM_RESERVED = 21;       // 다른 요청이 처리 중이다
  REJECT_CODE_INVENTORY_FULL = 22;
  REJECT_CODE_SERVICE_UNAVAILABLE = 23; // Backend 응답을 받지 못했다. 같은 request_id로 재시도
  REJECT_CODE_NOT_OWNER = 24;           // 이 Zone이 캐릭터의 소유자가 아니다. 세션이 끝나고 다시 입장해야 한다
  // 지역 이동 (ChangeZone)
  REJECT_CODE_UNKNOWN_PORTAL = 30;
  REJECT_CODE_OUT_OF_PORTAL_RANGE = 31;
  REJECT_CODE_TRANSFER_IN_PROGRESS = 32; // 이미 이동 중
  REJECT_CODE_ZONE_UNAVAILABLE = 33;     // 도착 Zone이 없다. 나중에 다시
}

message CommandResult {
  uint64 request_id = 1;
  CommandStatus status = 2;
  uint32 state_version = 3;
  RejectCode reject_code = 4;
}

// 획득·소비 뒤 수신자 자신의 인벤토리와 지갑. 전체 상태를 보내므로 유실돼도 다음 것이 대체한다.
message InventoryItem {
  bytes item_instance_id = 1;
  uint32 item_template_id = 2;
  uint32 slot_no = 3;
}

message InventoryUpdate {
  repeated InventoryItem items = 1;
  uint32 capacity = 2;
  uint32 version = 3;
  uint64 gold = 4;
}

// 관심 영역 안에서 벌어진 피해. 피격자 자신, 피격자를 시야에 둔 플레이어, 공격자에게 간다.
message CombatEvent {
  uint64 attacker_id = 1;
  uint64 target_id = 2;
  uint32 skill_id = 3;      // 0 = 몬스터 기본 공격
  uint32 damage = 4;
  uint32 target_hp = 5;     // 피해 적용 후
  bool killed = 6;
}
