syntax = "proto3";

package sa.game.v1;

import "game/common.proto";
import "game/framing.proto";

option csharp_namespace = "Sa.Game.V1";

// 클라이언트 → Gateway. 모든 메시지는 이 봉투 하나로 감싼다.
message ClientMessage {
  oneof body {
    Hello hello = 1;
    Ping ping = 2;
    MoveInput move_input = 10;
    CastSkill cast_skill = 11;
    PickupItem pickup_item = 12;
    ChangeZone change_zone = 13;
    TradeOpen trade_open = 14;
    TradeOffer trade_offer = 15;
    TradeAccept trade_accept = 16;
    TradeCancel trade_cancel = 17;
  }
}

// 접속 직후 첫 메시지. 티켓은 Backend가 발급한 서명 토큰(ADR-0005).
message Hello {
  ProtocolVersion protocol_version = 1;
  bytes entry_ticket = 2;
}

message Ping {
  uint32 nonce = 1;
  uint64 client_time_ms = 2;
}

// 0의 뜻: proto3는 0을 "보내지 않음"과 구별하지 않는다. 그래서 id와 순번은 1부터 쓰고, 0은 "없음"이다.
// 요청 id가 0인 명령은 REJECT_CODE_INVALID_REQUEST로 거절되고 재시도 기록에 남지 않는다.

// 이동 입력. 서버가 위치를 적분한다. direction은 정규화된 방향 또는 영벡터(정지).
message MoveInput {
  uint32 input_seq = 1;   // 연결마다 1부터 증가. 이전 이하의 순번은 버려진다
  Vec2 direction = 2;
  uint32 client_tick = 3;
}

message CastSkill {
  uint64 request_id = 1;  // 세션마다 1부터. 같은 id로 다시 보내면 같은 결과가 온다
  uint32 skill_id = 2;    // game-data의 스킬 id(1부터)
  oneof target {
    uint64 target_entity_id = 3;  // 엔티티 id는 1부터. 대상 지정 스킬
    Vec2 direction = 4;           // 투사체 스킬
  }
}

message PickupItem {
  uint64 request_id = 1;      // 세션마다 1부터
  uint64 item_entity_id = 2;  // 바닥 아이템의 엔티티 id(1부터)
}

message ChangeZone {
  uint64 request_id = 1;  // 세션마다 1부터
  uint32 portal_id = 2;
}

// 거래 (ADR-0013). 협상 상태는 Backend가 갖고 Zone이 중계한다. 네 메시지 모두 CommandResult로
// 수락·거절·대기를 받고, 거래의 상태 변화는 양쪽에 TradeUpdate로 온다. 결과를 못 받았으면 같은
// request_id로 다시 보낸다.
message TradeOpen {
  uint64 request_id = 1;
  uint64 target_entity_id = 2;  // 거래 범위 안의 플레이어
}

message TradeOffer {
  uint64 request_id = 1;
  bytes trade_id = 2;
  repeated bytes item_instance_ids = 3;  // 내 인벤토리의 아이템. 이전 제안을 통째로 바꾼다
  uint64 gold = 4;
}

message TradeAccept {
  uint64 request_id = 1;
  bytes trade_id = 2;
  uint32 version = 3;  // 내가 본 제안의 버전. 그 사이 바뀌었으면 거절된다
}

message TradeCancel {
  uint64 request_id = 1;
  bytes trade_id = 2;
}
