# Zone B. Values are initial proposals (see README "Zone의 한 틱"), not measured optima.
[zone]
world_id = 1
zone_id = 2
simulation_hz = 20
snapshot_hz = 10            # must divide simulation_hz
max_catch_up_ticks = 5
# rng_seed = 1             # absent: a random seed is picked at start-up and logged
stats_log_interval_sec = 10
max_sessions = 2000

# Gateways connect here (contracts/internal). Internal network only.
[gateway_link]
listen_address = "0.0.0.0"
listen_port = 7802
max_gateways = 8
max_frame_bytes = 262144  # a SessionOutput wraps one client frame (<= 64 KiB) plus headers
close_linger_ms = 1000     # bounds closing a link at shutdown when the gateway does not close its side
silence_timeout_ms = 5000  # nothing from a gateway this long: close its link; it pings every second
# Snapshot backpressure (ADR-0011): one snapshot tick fills a gateway's link up to this many unsent
# bytes; the remaining sessions wait for a later tick, longest-waiting first. Nothing is dropped:
# a view carries everything since that player's previous one. Proposal, see docs/reports/03.
snapshot_budget_bytes = 4194304

[backend]
address = "localhost:5101"
rpc_timeout_ms = 2000
lease_renew_interval_ms = 5000   # see README "소유권과 lease": heartbeat 5 s, lease 15 s
lease_safety_margin_ms = 2000
call_attempts = 3                # every call repeats safely: kill id, request key, transfer id, version
retry_delay_ms = 500
checkpoint_interval_ms = 15000   # a moving character's position is saved this often (ADR-0010)

# Paths are relative to the working directory (repository root in development, /app in containers).
[content]
map_file = "game-data/maps/zone-2.toml"
movement_rules_file = "game-data/rules/movement.toml"
economy_rules_file = "game-data/rules/economy.toml"
dir = "game-data"

# In-process bots for simulation development. Keep 0 in any deployed configuration.
[dev]
local_bots = 0
# Read only when local_bots > 0. The bots wander and dawdle a little at each destination so the
# crowd does not move in lockstep.
bot_class_id = 1

[dev.wanderer]
arrive_distance_m = 1.0
retarget_after_ticks = 400
idle_ticks_min = 0
idle_ticks_max = 40
margin_m = 2.0

[shutdown]
# After SIGTERM evicts every session, the time eviction frames get before the gateway links close.
# The process then exits once links have closed and economy calls (retries included) answered.
grace_ms = 2000

[logging]
level = "info"
