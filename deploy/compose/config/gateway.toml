[listen]
address = "0.0.0.0"
port = 7777
max_connections = 1000

# Browser viewer transport: the same protobuf messages as WebSocket binary frames (ADR-0004).
[websocket]
enabled = true
address = "0.0.0.0"
port = 7778

[protocol]
# May only tighten the contract maximum (FRAMING_MAX_PAYLOAD_BYTES).
max_payload_bytes = 65536
# Per connection. Movement at 20 Hz plus pings leaves headroom; a flood is kicked.
max_messages_per_second = 60
# Closing a client waits this long for it to read our last message and close its side, then
# resets the connection and frees its slot. Bounds clients that stop reading.
close_linger_ms = 2000
# From accepting a connection (WebSocket handshake included) to a valid Hello; idle sockets are
# kicked so they cannot hold every connection slot.
hello_timeout_ms = 5000

[ticket]
# Shared with the Backend (WorldDirectory:TicketSigningKey). Inject via SA_GATEWAY__TICKET__SIGNING_KEY_BASE64.
signing_key_base64 = ""
key_id = 1
max_clock_skew_ms = 2000

[backend]
address = "localhost:5101"
rpc_timeout_ms = 2000
lease_renew_interval_ms = 5000
lease_safety_margin_ms = 2000

[zone_link]
max_frame_bytes = 262144
reconnect_backoff_ms = 1000
# Bounds closing a zone link at shutdown when the zone does not close its side.
close_linger_ms = 1000

# Topology: which zone process serves which zone id. The Backend assigns characters to zone ids.
[[zones]]
zone_id = 1
address = "localhost"
port = 7801

[[zones]]
zone_id = 2
address = "localhost"
port = 7802

[shutdown]
# After SIGTERM kicks every session, the time detaches and EndSession calls get before the zone
# links close. Must exceed backend.rpc_timeout_ms.
grace_ms = 3000

[logging]
level = "info"
