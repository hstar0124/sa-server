# Backend: HTTP for clients and the viewer (NodePort), gRPC for gateways and zones (cluster only).
# The gateway address it hands to clients comes from the backend-env ConfigMap that
# scripts/k3s-stack.sh fills with the node's address and the gateway NodePorts.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5100
    - name: grpc
      port: 5101
---
apiVersion: v1
kind: Service
metadata:
  name: backend-public
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 5100
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: sa/backend:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-env
          env:
            # The internal gRPC has no caller authentication yet, so it listens on loopback by
            # default. In the cluster zones and gateways are other pods; it listens on every
            # address and network-policy.yaml admits only pods of this namespace.
            - name: Kestrel__Endpoints__Grpc__Url
              value: http://0.0.0.0:5101
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: sa-database
                  key: connection-string
            - name: Auth__SigningKey
              valueFrom:
                secretKeyRef:
                  name: sa-keys
                  key: jwt-signing-key
            - name: WorldDirectory__TicketSigningKey
              valueFrom:
                secretKeyRef:
                  name: sa-keys
                  key: ticket-signing-key
          ports:
            - name: http
              containerPort: 5100
            - name: grpc
              containerPort: 5101
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
