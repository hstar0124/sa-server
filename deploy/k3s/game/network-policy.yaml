# The Backend's gRPC (tickets, sessions, leases, economy) has no caller authentication yet: only
# pods of this namespace reach it. Its HTTP API is public (NodePort) and stays open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-grpc-from-game-only
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 5100
    - from:
        - podSelector: {}
      ports:
        - port: 5101
